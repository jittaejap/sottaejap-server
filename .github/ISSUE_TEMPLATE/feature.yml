name: 기능 개발
description: 새로운 기능의 목적과 완료 조건을 정의합니다.
title: '[Feat] '
body:
  - type: dropdown
    id: affected-area
    attributes:
      label: 영향 영역
      description: 기능을 구현할 영역을 선택해 주세요.
      options:
        - 화면 (views · components)
        - API 연동 (api · stores)
        - 스타일 · 디자인 토큰
        - 빌드 설정
        - CI/CD · 배포
        - 문서
        - 여러 영역
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 개발 목적
      description: 이 기능이 필요한 이유와 해결하려는 문제를 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 구현 범위
      description: 이번 작업에 포함할 기능과 변경 사항을 작성해 주세요.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: 제외 범위
      description: 관련은 있지만 이번 작업에서 다루지 않을 내용을 작성해 주세요. 없다면 "없음"으로 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: user-flow
    attributes:
      label: 사용자 흐름
      description: 사용자가 기능을 시작해서 목표를 달성하는 흐름을 작성해 주세요.
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: 영향 항목
      description: 변경되는 항목을 모두 선택해 주세요.
      options:
        - label: 화면 또는 사용자 경험
        - label: API 계약
        - label: 인증 또는 보안
        - label: 접근성
        - label: 스키마 또는 마이그레이션
        - label: CI/CD 또는 배포
        - label: 문서

  - type: textarea
    id: completion-criteria
    attributes:
      label: 완료 조건
      description: 구현과 검증이 완료됐다고 판단할 수 있는 조건을 작성해 주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 문서(03 IA 번호 · 05 API 명세), 피그마, Issue 또는 링크를 작성해 주세요. 없다면 "없음"으로 작성해 주세요.
    validations:
      required: true
