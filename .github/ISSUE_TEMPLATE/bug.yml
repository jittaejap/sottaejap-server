name: 버그 수정
description: 발생한 문제를 재현하고 수정합니다.
title: '[Fix] '
body:
  - type: markdown
    attributes:
      value: |
        같은 문제가 이미 등록되어 있는지 먼저 확인해 주세요.
        공개하면 안 되는 개인정보, 인증정보, 보안 취약점은 Issue에 작성하지 마세요.

  - type: dropdown
    id: affected-area
    attributes:
      label: 영향 영역
      description: 문제가 발생한 영역을 선택해 주세요.
      options:
        - 화면 (views · components)
        - API 연동 (api · stores)
        - 스타일 · 디자인 토큰
        - 빌드 설정
        - CI/CD · 배포
        - 문서
        - 여러 영역
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 발생한 문제와 사용자 또는 시스템에 미치는 영향을 설명해 주세요.
      placeholder: 어떤 문제가 발생했는지 구체적으로 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 같은 문제를 확인할 수 있도록 순서대로 작성해 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: 예상 결과
      description: 정상적으로 동작했을 때의 결과를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: 실제 결과
      description: 실제로 확인한 결과와 오류 메시지를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 저장소, 브랜치 또는 커밋, 운영체제, 브라우저 등 재현에 필요한 정보를 작성해 주세요.
      placeholder: |
        - 저장소:
        - 브랜치 또는 커밋:
        - 운영체제:
        - 브라우저 또는 실행 환경:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 로그와 화면 자료
      description: 원인 파악에 도움이 되는 로그, 스크린샷, 영상이 있다면 첨부해 주세요.

  - type: textarea
    id: proposed-solution
    attributes:
      label: 예상 원인과 수정 방향
      description: 예상하는 원인이나 해결 방법이 있다면 작성해 주세요.

  - type: textarea
    id: completion-criteria
    attributes:
      label: 완료 조건
      description: 수정이 완료됐다고 판단할 수 있는 조건과 검증 방법을 작성해 주세요.
      placeholder: |
        - [ ] 동일한 문제가 다시 발생하지 않는다.
        - [ ] 관련 회귀 검증을 통과한다.
    validations:
      required: true

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: 민감정보 확인
      options:
        - label: 공개하면 안 되는 개인정보, 인증정보, 보안 취약점이 포함되지 않았습니다.
          required: true
