# 로컬 개발용 구성. 한 줄로 db·server·ai 를 함께 띄운다 (07 §4).
#   docker compose up            # 셋 다 (.env 의 JWT_SECRET 을 채워야 server 가 뜬다)
#   docker compose up -d db      # DB만 (.env 없이도 된다 — 스프링·AI를 IDE·터미널에서 직접 띄울 때)
#   docker compose up --build    # 코드를 고친 뒤 (bind mount 가 없어 자동 반영되지 않는다)
#
# ${KEY} 는 이 폴더의 .env 를 compose 가 자동으로 읽어 채운다. .env 가 없으면 아래 잠정값이 쓰이고,
# 잠정값이 없는 JWT_SECRET 만 빈 값이 되어 server 가 기동에 실패한다 (db · ai 는 뜬다).
# .env 를 env_file 로 통째로 넣지는 않는다 — 그 안의 주소는 전부 localhost 라, 컨테이너 안에서는
# 자기 자신을 가리켜 연결이 실패한다. 컨테이너용 주소는 아래에 직접 적는다.
#
# 잠정값을 두는 경계: 값을 아는 사람이 남의 토큰을 위조할 수 있는 키(JWT_SECRET)에는 두지 않고,
# 로컬 컨테이너 사이에서만 의미가 있는 값(DB_PASSWORD · AI_SHARED_SECRET)에는 둔다.
#
# EC2 운영 구성은 deploy/docker-compose.yml 이 따로 있다. 그쪽은 소스를 굽지 않고 Docker Hub
# 이미지를 받아 쓰며, 비밀값에 잠정값이 없어 없으면 즉시 멈춘다 — 아래 로컬 잠정값은 거기 닿지 않는다.
services:
  db:
    # pgvector 확장이 포함된 PostgreSQL 18. CREATE EXTENSION은 V8이 한다 (E-21).
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: sottaejap
      POSTGRES_USER: sottaejap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sottaejap}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    # 127.0.0.1 바인딩 — 같은 Wi-Fi의 다른 사람이 닿지 못한다. 아래 잠정 비밀값과 짝이다.
    # 브라우저·gradlew 는 호스트에서 도므로 localhost 흐름은 그대로다 (deploy 구성과 같은 방식).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # named volume만 쓴다. 호스트 바인드 마운트는 OS마다 경로 표기가 달라 깨진다 (07 §5-5).
      - sottaejap_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sottaejap -d sottaejap"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    environment:
      # 컨테이너끼리는 서비스 이름으로 부른다. localhost 는 컨테이너 자기 자신이다.
      DB_URL: jdbc:postgresql://db:5432/sottaejap
      DB_USER: sottaejap
      DB_PASSWORD: ${DB_PASSWORD:-sottaejap}
      # 비우면 server 만 기동에 실패한다 — JwtTokenProvider 가 "JWT_SECRET must not be blank —
      # 생성: openssl rand -base64 48" 을 던진다. ${JWT_SECRET:?...} 를 쓰지 않는 이유는
      # compose 의 변수 보간이 문서 전역이라, 그 표기 하나가 `up -d db` 까지 막기 때문이다.
      JWT_SECRET: ${JWT_SECRET:-}
      # 아래 두 잠정값은 application.yml 의 기본값 사본이다 — 그쪽을 바꾸면 여기도 바꾼다.
      # 사본을 두는 이유는 .env 의 빈 값이 yml 기본값을 덮기 때문이다 (RULES_* 주석과 같은 논리).
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:5173}
      AI_BASE_URL: http://ai:8000
      # 아래 ai 의 INTERNAL_SHARED_SECRET 과 같은 변수를 넘긴다 — 두 값이 갈라질 수 없다.
      # 갈라지면 server → ai 도, ai → server 역호출도 전부 401 이다 (E-37).
      AI_SHARED_SECRET: ${AI_SHARED_SECRET:-local-dev-secret}
      # 카카오 콘솔 키가 있는 사람만 .env 에 채운다. 비어 있으면 KAKAO 로그인만 502, 기동은 된다.
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URIS: ${KAKAO_REDIRECT_URIS:-http://localhost:5173/auth/callback}
      # Web Push (FR-10). 여기서 넘기지 않으면 .env 에 키를 채워도 컨테이너에는 안 들어가
      # 푸시만 조용히 꺼진다 — 원인을 찾기 어려운 종류의 침묵이다. 비어 있으면 푸시만 꺼진다.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # RULES_* 는 여기에 적지 않는다. 빈 문자열은 잠정값이 아니라 null 이라, application.yml 의
      # 잠정값을 덮어 회고 저장 첫 요청이 500(RuleParamMissingException)이 된다. 덮어쓸 때만 .env 에 키를 추가한다.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  ai:
    # 형제 폴더의 소스를 그 자리에서 굽는다 — 로컬은 방금 고친 AI 코드로 붙여봐야 의미가 있다.
    # 두 저장소가 나란히 있어야 한다 (07 §2). AI 저장소를 안 받았으면 `docker compose up db server`.
    build: ../sottaejap-ai
    environment:
      SPRING_BASE_URL: http://server:8080
      INTERNAL_SHARED_SECRET: ${AI_SHARED_SECRET:-local-dev-secret}
      # 비어 있어도 된다 — 템플릿 응답 + fallback: true 로 200 이다 (E-38).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 금융 RAG용 (07 §3). asyncpg 형식이라 jdbc: 접두사를 쓰지 않는다.
      # DB_PASSWORD 에 @ : / # ? 를 쓰면 이 URL 이 깨진다 — 영문·숫자만 쓴다.
      DATABASE_URL: postgresql://sottaejap:${DB_PASSWORD:-sottaejap}@db:5432/sottaejap
    # ai 이미지에는 HEALTHCHECK 가 없다. 기동 중인 컨테이너에 요청을 날리고 헤매지 않도록
    # compose 에서만 붙인다 (ai 저장소는 건드리지 않는다). python:3.12-slim 에 curl 이 없어 python 을 쓴다.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      start_period: 30s
      retries: 5
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sottaejap_db_data:
