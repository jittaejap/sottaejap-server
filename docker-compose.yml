# 로컬 개발용 구성. 한 줄로 db·server·ai 를 함께 띄운다 (07 §4).
#   docker compose up            # 셋 다
#   docker compose up -d db      # DB만 (스프링·AI를 IDE·터미널에서 직접 띄울 때)
#   docker compose up --build    # 코드를 고친 뒤 (bind mount 가 없어 자동 반영되지 않는다)
#
# ${KEY} 는 이 폴더의 .env 를 compose 가 자동으로 읽어 채운다. .env 가 없어도 아래 잠정값으로 뜬다.
# .env 를 env_file 로 통째로 넣지는 않는다 — 그 안의 주소는 전부 localhost 라, 컨테이너 안에서는
# 자기 자신을 가리켜 연결이 실패한다. 컨테이너용 주소는 아래에 직접 적는다.
#
# EC2 운영 구성은 deploy/docker-compose.yml 이 따로 있다. 그쪽은 소스를 굽지 않고 Docker Hub
# 이미지를 받아 쓰며, 비밀값에 잠정값이 없어 없으면 즉시 멈춘다 — 아래 로컬 잠정값은 거기 닿지 않는다.
services:
  db:
    # pgvector 확장이 포함된 PostgreSQL 18. CREATE EXTENSION은 V8이 한다 (E-21).
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: sottaejap
      POSTGRES_USER: sottaejap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sottaejap}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      # named volume만 쓴다. 호스트 바인드 마운트는 OS마다 경로 표기가 달라 깨진다 (07 §5-5).
      - sottaejap_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sottaejap -d sottaejap"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    environment:
      # 컨테이너끼리는 서비스 이름으로 부른다. localhost 는 컨테이너 자기 자신이다.
      DB_URL: jdbc:postgresql://db:5432/sottaejap
      DB_USER: sottaejap
      DB_PASSWORD: ${DB_PASSWORD:-sottaejap}
      # application.yml 에 잠정값이 없어 비면 기동 자체가 실패한다. 그래서 로컬 전용 값을 둔다.
      # 값은 Base64 32바이트 이상이어야 한다. 직접 만들려면: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:-bG9jYWwtZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY3OA==}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:5173}
      AI_BASE_URL: http://ai:8000
      # 아래 ai 의 INTERNAL_SHARED_SECRET 과 같은 변수를 넘긴다 — 두 값이 갈라질 수 없다.
      # 갈라지면 server → ai 도, ai → server 역호출도 전부 401 이다 (E-37).
      AI_SHARED_SECRET: ${AI_SHARED_SECRET:-local-dev-secret}
      # 카카오 콘솔 키가 있는 사람만 .env 에 채운다. 비어 있으면 KAKAO 로그인만 502, 기동은 된다.
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URIS: ${KAKAO_REDIRECT_URIS:-http://localhost:5173/auth/callback}
      # RULES_* 는 여기에 적지 않는다. 빈 문자열은 잠정값이 아니라 null 이라, application.yml 의
      # 잠정값을 덮어 회고 저장 첫 요청이 500(RuleParamMissingException)이 된다. 덮어쓸 때만 .env 에 키를 추가한다.
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  ai:
    # 형제 폴더의 소스를 그 자리에서 굽는다 — 로컬은 방금 고친 AI 코드로 붙여봐야 의미가 있다.
    # 두 저장소가 나란히 있어야 한다 (07 §2). AI 저장소를 안 받았으면 `docker compose up db server`.
    build: ../sottaejap-ai
    environment:
      SPRING_BASE_URL: http://server:8080
      INTERNAL_SHARED_SECRET: ${AI_SHARED_SECRET:-local-dev-secret}
      # 비어 있어도 된다 — 템플릿 응답 + fallback: true 로 200 이다 (E-38).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 금융 RAG용 (07 §3). asyncpg 형식이라 jdbc: 접두사를 쓰지 않는다.
      # DB_PASSWORD 에 @ : / # ? 를 쓰면 이 URL 이 깨진다 — 영문·숫자만 쓴다.
      DATABASE_URL: postgresql://sottaejap:${DB_PASSWORD:-sottaejap}@db:5432/sottaejap
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sottaejap_db_data:
