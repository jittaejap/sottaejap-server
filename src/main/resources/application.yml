# 값은 .env(로컬) 또는 컨테이너 환경 변수에서 온다. 키 목록의 정본은 sottaejap-docs/07_기술스택_레포구성.md §3.
spring:
  application:
    name: sottaejap-server
  config:
    # 로컬 개발에서 .env를 properties로 읽는다. 없으면 무시한다 (CI·컨테이너는 환경 변수 직접 주입).
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # 6개월치 카드 CSV가 기본값 1MB를 넘는다 (05 §2 업로드).
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 정본은 Flyway다. 엔티티와 어긋나면 기동 시점에 실패시킨다.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: sottaejap
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:86400}
  allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
  demo-account:
    enabled: ${DEMO_ACCOUNT_ENABLED:true}
    email: demo@sottaejap.kr
  # 카카오 로그인 (E-55). 클라이언트가 받은 인가 코드를 서버가 교환한다 — spring.security.oauth2(oauth2Login)는 쓰지 않는다.
  # 키가 비어 있어도 기동은 된다(CI · 키 없는 로컬). 그 상태의 KAKAO 로그인은 502 OAUTH_PROVIDER_ERROR.
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # 허용할 클라이언트 콜백 URL, 쉼표 구분. 카카오 콘솔 등록값과 같아야 한다 (07 §3).
    redirect-uris: ${KAKAO_REDIRECT_URIS:http://localhost:5173/auth/callback}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    timeout-ms: 5000

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  shared-secret: ${AI_SHARED_SECRET:}
  timeout-ms: ${AI_TIMEOUT_MS:15000}

# 규칙 엔진 파라미터 (07 §7). v2.2 잠정값이 기본값이고 RULES_* 환경변수로 덮어쓴다 (E-57) — 코드에 상수 금지.
# 근거 있는 확정값이 아니다. 데이터 확보 후(06 #15~#18 · #20) 여기 값만 바꾼다.
rules:
  shrinkage-k: ${RULES_SHRINKAGE_K:3}
  rollup-min-count: ${RULES_ROLLUP_MIN_COUNT:3}
  pending-min-count: ${RULES_PENDING_MIN_COUNT:3}
  axis-x-boundary: ${RULES_AXIS_X_BOUNDARY:0.1}
  axis-y-boundary: ${RULES_AXIS_Y_BOUNDARY:0}
  chat-window-days: ${RULES_CHAT_WINDOW_DAYS:3}
  sensitivity:
    conservative: ${RULES_SENSITIVITY_CONSERVATIVE:3.0}
    standard: ${RULES_SENSITIVITY_STANDARD:2.0}
    sensitive: ${RULES_SENSITIVITY_SENSITIVE:1.5}
  candidate:
    outlier-baseline-days: ${RULES_CANDIDATE_OUTLIER_BASELINE_DAYS:90}
    outlier-min-samples: ${RULES_CANDIDATE_OUTLIER_MIN_SAMPLES:5}
    big-amount-budget-ratio: ${RULES_CANDIDATE_BIG_AMOUNT_BUDGET_RATIO:0.1}
    repeated-low-min-count: ${RULES_CANDIDATE_REPEATED_LOW_MIN_COUNT:2}
  cluster:
    meal-categories: ${RULES_CLUSTER_MEAL_CATEGORIES:식사,식비,음식점,외식,배달,한식,중식,일식,양식,분식,패스트푸드,카페}
