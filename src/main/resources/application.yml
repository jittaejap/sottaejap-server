# 값은 .env(로컬) 또는 컨테이너 환경 변수에서 온다. 키 목록의 정본은 sottaejap-docs/07_기술스택_레포구성.md §3.
spring:
  application:
    name: sottaejap-server
  config:
    # 로컬 개발에서 .env를 properties로 읽는다. 없으면 무시한다 (CI·컨테이너는 환경 변수 직접 주입).
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 정본은 Flyway다. 엔티티와 어긋나면 기동 시점에 실패시킨다.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 카카오 OAuth2 — 07 §10 리스크 1 스파이크에서 연다. client-id가 비면 Boot가 기동을 거부하므로 그때까지 주석.
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         kakao:
  #           client-id: ${KAKAO_CLIENT_ID}
  #           client-secret: ${KAKAO_CLIENT_SECRET}
  #           redirect-uri: ${KAKAO_REDIRECT_URI}
  #           authorization-grant-type: authorization_code
  #           client-authentication-method: client_secret_post
  #           scope: profile_nickname
  #       provider:
  #         kakao:
  #           authorization-uri: https://kauth.kakao.com/oauth/authorize
  #           token-uri: https://kauth.kakao.com/oauth/token
  #           user-info-uri: https://kapi.kakao.com/v2/user/me
  #           user-name-attribute: id

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: sottaejap
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:86400}
  allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
  demo-account:
    enabled: ${DEMO_ACCOUNT_ENABLED:true}
    email: demo@sottaejap.kr

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  shared-secret: ${AI_SHARED_SECRET:}
  timeout-ms: ${AI_TIMEOUT_MS:15000}

# 규칙 엔진 파라미터 (07 §7). 9/7 데이터 확보 후 값을 넣는다. 비어 있으면 null로 바인딩된다 — 코드에 상수 금지.
rules:
  shrinkage-k: ${RULES_SHRINKAGE_K:}
  rollup-min-count: ${RULES_ROLLUP_MIN_COUNT:}
  pending-min-count: ${RULES_PENDING_MIN_COUNT:}
  axis-x-boundary: ${RULES_AXIS_X_BOUNDARY:}
  axis-y-boundary: ${RULES_AXIS_Y_BOUNDARY:}
